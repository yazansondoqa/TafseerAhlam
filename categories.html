<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارٍ التحويل إلى تصنيفات الرموز | فسر حلمك</title>
    <meta name="description" content="تم نقل صفحات التصنيفات إلى العناوين الثابتة الجديدة.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.tafseerahlam.store/categories/">
    <meta http-equiv="refresh" content="0; url=https://www.tafseerahlam.store/categories/">
    <script>
    (function () {
        var map = {"animals":"/categories/animals","water":"/categories/water","food":"/categories/food","clothing":"/categories/clothing","religion":"/categories/religion","travel":"/categories/travel","plants":"/categories/plants","family":"/categories/family","house":"/categories/house","emotions":"/categories/emotions"};
        var params = new URLSearchParams(window.location.search);
        var key = params.get("category") || params.get("symbol") || "";
        var dest = map[key] || map[key.replace(/[أإآ]/g, "ا")] || "/categories/";
        window.location.replace(dest);
    })();
    </script>
</head>
<body>
    <p>يتم تحويلك إلى الصفحة الجديدة. إذا لم يحدث التحويل تلقائياً، <a href="/categories/">اضغط هنا</a>.</p>
</body>
</html>
